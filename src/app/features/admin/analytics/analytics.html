<div class="container-fluid p-0">
  <div class="row">
    <div class="col-12 col-md-6">
      <div class="card">
        <div class="d-flex flex-column flex-sm-row justify-content-between mb-2">
            <h3 class="mb-2 mb-sm-0 text-primary fw-semibold font-16">Number of patients</h3>
            <select class="form-select form-select-md w-100 "
               aria-label="Default select example">
                <option selected>Jan 2025</option>
                <option value="1">Feb 2025</option>
                <option value="2">March 2025</option>
              </select>
        </div>
        <apx-chart [series]="chartOptions.series" [chart]="chartOptions.chart" [xaxis]="chartOptions.xaxis"
        [plotOptions]="chartOptions.plotOptions" [dataLabels]="chartOptions.dataLabels">
      </apx-chart> 
      </div>
    </div>
