 <h2 mat-dialog-title>
   Facility (s)
   <button matIconButton class="close--btn" mat-dialog-close>
     <mat-icon>close_small</mat-icon>
   </button>
 </h2>

 <mat-dialog-content>
   <form>
     <div class="row">
        <div class="col-12 mb-3">
            <h3 class="font-16 fw-semibold text-primary m-0">Facility 1</h3>
        </div>
       <div class="col-12 mb-4">
         <label class="form-label">Facility Name<span class="text-error">*</span></label>
         <input type="text" class="form-control" value="Sunrise Medical Center " placeholder="Ente facility name">
       </div>
       <div class="col-12 col-md-6 mb-4">
         <label class="form-label">Apartment / Suite No<span class="text-error">*</span></label>
         <input type="text" class="form-control" value="2450 Elm Street" placeholder="Ente apartment / suite No">
       </div>
       <div class="col-12 col-md-6 mb-4">
         <label class="form-label">Street<span class="text-error">*</span></label>
         <input type="text" class="form-control" value="2450 Elm Street" placeholder="Ente street">
       </div>
        <div class="col-12 mb-4">
         <label class="form-label">Locality<span class="text-error">*</span></label>
         <input type="text" class="form-control" value="2450 Elm Street" placeholder="Ente locality">
       </div>
        <div class="col-12 mb-4">
         <label class="form-label">State<span class="text-error">*</span></label>
         <select class="form-select w-100 " aria-label="Default select example" name="ps">
            <option selected>TX</option>
            <option value="1">Texax</option>
            <option value="2">Texax 2</option>
        </select>
       </div>
       <div class="col-12 mb-4">
         <label class="form-label">City<span class="text-error">*</span></label>
         <select class="form-select w-100 " aria-label="Default select example" name="ps">
            <option selected>Dallas</option>
            <option value="1">Dallas 1</option>
            <option value="2">Dallas 2</option>
        </select>
       </div>
       <div class="col-12 mb-4">
         <label class="form-label">ZIP<span class="text-error">*</span></label>
         <input type="text" class="form-control" value="245001" placeholder="Ente zip">
       </div>
     </div>
     <div class="row">
        <div class="col-12 mb-3">
            <h3 class="font-16 fw-semibold text-primary m-0">Facility 2</h3>
        </div>
       <div class="col-12 mb-4">
         <label class="form-label">Facility Name<span class="text-error">*</span></label>
         <input type="text" class="form-control" value="Sunrise Medical Center " placeholder="Ente facility name">
       </div>
       <div class="col-12 col-md-6 mb-4">
         <label class="form-label">Apartment / Suite No<span class="text-error">*</span></label>
         <input type="text" class="form-control" value="2450 Elm Street" placeholder="Ente apartment / suite No">
       </div>
       <div class="col-12 col-md-6 mb-4">
         <label class="form-label">Street<span class="text-error">*</span></label>
         <input type="text" class="form-control" value="2450 Elm Street" placeholder="Ente street">
       </div>
        <div class="col-12 mb-4">
         <label class="form-label">Locality<span class="text-error">*</span></label>
         <input type="text" class="form-control" value="2450 Elm Street" placeholder="Ente locality">
       </div>
        <div class="col-12 mb-4">
         <label class="form-label">State<span class="text-error">*</span></label>
         <select class="form-select w-100 " aria-label="Default select example" name="ps">
            <option selected>TX</option>
            <option value="1">Texax</option>
            <option value="2">Texax 2</option>
        </select>
       </div>
       <div class="col-12 mb-4">
         <label class="form-label">City<span class="text-error">*</span></label>
         <select class="form-select w-100 " aria-label="Default select example" name="ps">
            <option selected>Dallas</option>
            <option value="1">Dallas 1</option>
            <option value="2">Dallas 2</option>
        </select>
       </div>
       <div class="col-12 mb-4">
         <label class="form-label">ZIP<span class="text-error">*</span></label>
         <input type="text" class="form-control" value="245001" placeholder="Ente zip">
       </div>
     </div>
   </form>
 </mat-dialog-content>

 <mat-dialog-actions align="end">
   <button type="button" class="btn btn-primary" mat-dialog-close>Save</button>
 </mat-dialog-actions>
