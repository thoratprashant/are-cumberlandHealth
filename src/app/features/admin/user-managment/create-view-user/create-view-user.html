<div class="container-fluid listing--wrapper p-0">
  <div class="row">
    <div class="col-12 col-lg-8">
      <div class="row">
        <div class="col-12 d-flex align-items-center justify-content-between mt-2">
          <div class="d-flex align-items-center">
            <button type="button" class="btn btn-secondary back--button me-2 me-sm-3 flex-shrink-0"
              routerLink="/admin/user-managment">
              <mat-icon>arrow_back</mat-icon>
            </button>
            <h4 class="fw-medium mb-0">Create User</h4>
          </div>
          <div class="d-flex align-items-center">
            <button type="button" class="btn btn-md btn-secondary me-2">Cancel</button>
            <button type="button" class="btn btn-md btn-primary">Submit</button>
          </div>
        </div>
        <div class="col-12">
          <div class="card mt-3 mt-sm-4">
            <div class="row">

              <div class="col-12 mb-4">
                <label class="form-label">User Role</label>
                <select class="form-select form-select-md w-100" aria-label="Default select example">
                  <option selected>Select Role</option>
                  <option value="1">Provider</option>
                  <option value="2">Front Desk</option>
                </select>
              </div>
              <div class="col-12 mb-4">
                <label class="form-label">First name </label>
                <input type="text" class="form-control" placeholder="Enter first name">
              </div>
              <div class="col-12 mb-4">
                <label class="form-label">Last Name </label>
                <input type="text" class="form-control" placeholder="Enter last name">
              </div>
              <div class="col-12 mb-4">
                <label class="form-label">Email ID</label>
                <input type="text" class="form-control" placeholder="Enter email id">
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
