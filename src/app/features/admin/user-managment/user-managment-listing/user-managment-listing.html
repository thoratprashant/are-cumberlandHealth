<div class="container-fluid listing--wrapper p-0">
  <div class="row">
    <div class="col-12">
      <div class="sorting--head">
        <div class="row">
          <div class="col-12 col-sm-10 col-md-9 col-lg-10 ">
            <div class="d-flex align-items-start gap-3 ">
              <div class="position-relative w-100  ">
                <input type="text" class="form-control form-control-md pe-5" placeholder="Search"
                  (keyup)="applyFilter($event)">
                <button type="button" mat-icon-button class="icon--password p-0">
                  <mat-icon fontSet="material-icons-outlined">
                    search
                  </mat-icon>
                </button>
              </div>
              <select class="form-select form-select-md w-100 "
               aria-label="Default select example">
                <option selected>Select Status</option>
                <option value="1">Active</option>
                <option value="2">In-Active</option>
              </select>
              <select class="form-select form-select-md w-100" aria-label="Default select example">
                <option selected>Select Role</option>
                <option value="1">Provider</option>
                <option value="2">Front Desk</option>
              </select>
              <button type="button" class="btn btn-md btn-secondary flex-shrink-0">Reset filter</button>
            </div>
          </div>
          <div class="col-12 col-sm-2 col-md-3 col-lg-2  text-end">
            <button type="button" class="btn btn-md btn-primary">Create User</button>
          </div>
        </div>
      </div>
    </div>
    <div class="col-12"> 
      <div class="material--table">
        <table mat-table [dataSource]="dataSource" matSort>

          <!-- ID -->
          <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> ID </th>
            <td mat-cell *matCellDef="let row"> PS49201{{ row.id }} </td>
          </ng-container>

          <!-- name -->
          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Name </th>
            <td mat-cell *matCellDef="let row"> {{ row.name }} </td>
          </ng-container>

          <!-- Email ID -->
          <ng-container matColumnDef="emailid">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>
              Email ID
            </th>
            <td mat-cell *matCellDef="let row"> {{ row.emailid }} </td>
          </ng-container>

          <!-- Requested On -->
          <ng-container matColumnDef="role">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>
              Role
            </th>
            <td mat-cell *matCellDef="let row">
              {{ row.role }}
            </td>
          </ng-container>

          <!-- Status -->
          <ng-container matColumnDef="status">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Status </th>
            <td mat-cell *matCellDef="let row">
              <span class="status" [ngClass]="row.status.toLowerCase()">
                {{ row.status }}
              </span>
            </td>
          </ng-container>

          <!-- Action -->
          <ng-container matColumnDef="action">
            <th mat-header-cell *matHeaderCellDef> Action </th>
            <td mat-cell *matCellDef="let row">
              <button mat-icon-button color="primary">
                <mat-icon>visibility</mat-icon>
              </button>
              <button mat-icon-button color="accent">
                <mat-icon>edit</mat-icon>
              </button>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

          <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell" colspan="6">No records found</td>
          </tr>
        </table>

        <mat-paginator [pageSizeOptions]="[5, 10, 25, 50]" showFirstLastButtons>
        </mat-paginator>
      </div> 
    </div>
  </div>
</div>
