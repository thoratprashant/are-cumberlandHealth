<div class="login--wrapper d-flex flex-column">
  <h2 class="fw-medium">Verification</h2>

  <form [formGroup]="otpForm">
    <div class="row">

      <div class="col-12 mb-2">
        <p class="font-14">
          We've sent a verification code to
          <span class="fw-medium">loremipsum@ark.com</span>.
          Please enter it below to continue.
        </p>
      </div>

      <div class="col-12 mb-2">
        <label class="form-label">
          Verification Code <span class="text-danger">*</span>
        </label>

        <input
          type="text"
          maxlength="6"
          class="form-control"
          formControlName="otp"
          placeholder="Enter 6 digit code"
        />

        <small class="text-danger" *ngIf="otpControl?.invalid && otpControl?.touched">
          Please enter a valid 6-digit code
        </small>
      </div>

      <div class="col-12 d-flex justify-content-end">
        <p class="text-danger mb-3">
          Expires in {{ timeLeft }} seconds
        </p>
      </div>

      <div class="col-12 mb-3">
        <a class="text-primary" routerLink="/auth/login">
          Resend Verification Code
        </a>
      </div>

      <div class="col-12">
        <button
          type="button"
          class="btn btn-primary w-100"
          routerLink="/auth/reset-password"
          [disabled]="otpForm.invalid || timeLeft === 0">
          Submit
        </button>
      </div>
      <div class="col-12 d-flex my-2 my-sm-4">
        <a class="text-primary" routerLink="/auth/login">Back to login</a>  
      </div>

    </div>
  </form>
</div>
