<div class="container-fluid listing--wrapper p-0">
    <div class="row">
        <div class="col-12">
            <div class="sorting--head">
                <div class="row">
                    <div class="col-12 col-md-12 col-lg-8 ">
                        <div class="d-flex align-items-start flex-sm-row flex-column gap-3">
                            <div class="position-relative w-100">
                                <input class="form-control" [owlDateTime]="dtPicker" [owlDateTimeTrigger]="dtPicker" placeholder="Requested Time To"/>
                                <owl-date-time #dtPicker></owl-date-time>
                                 <button type="button"  mat-icon-button class="icon--password"  (click)="dtPicker.open()" >
                                        <mat-icon fontSet="material-icons-outlined">schedule</mat-icon>
                                </button>  
                            </div>
                             <div class="position-relative w-100">
                                <input class="form-control" [owlDateTime]="dtPicker2" [owlDateTimeTrigger]="dtPicker2" placeholder="Requested Time To"/>
                                <owl-date-time #dtPicker2></owl-date-time>
                                 <button type="button"  mat-icon-button class="icon--password"  (click)="dtPicker2.open()" >
                                        <mat-icon fontSet="material-icons-outlined">schedule</mat-icon>
                                </button>  
                            </div>
                            <button type="button" class="btn btn-md btn-secondary flex-shrink-0">Reset filter</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-12">
            <div class="material--table">
                <table mat-table [dataSource]="dataSource" matSort>

                    <!-- ID -->
                    <ng-container matColumnDef="id">
                        <th mat-header-cell *matHeaderCellDef mat-sort-header> ID </th>
                        <td mat-cell *matCellDef="let row"> PS49201{{ row.id }} </td>
                    </ng-container>

                    <!-- Patient -->
                    <ng-container matColumnDef="patient">
                        <th mat-header-cell *matHeaderCellDef mat-sort-header> Patient </th>
                        <td mat-cell *matCellDef="let row">
                            {{ row.patient }}
                        </td>
                    </ng-container>

                    <!-- Provider -->
                    <ng-container matColumnDef="provider">
                        <th mat-header-cell *matHeaderCellDef mat-sort-header> Provider </th>
                        <td mat-cell *matCellDef="let row">
                            {{ row.provider }}
                        </td>
                    </ng-container>

                    <!-- Requested On -->
                    <ng-container matColumnDef="requestedOn">
                        <th mat-header-cell *matHeaderCellDef mat-sort-header> Requested on </th>
                        <td mat-cell *matCellDef="let row">
                            {{ row.requestedOn }}
                        </td>
                    </ng-container>

                    <!-- Status -->
                    <ng-container matColumnDef="status">
                        <th mat-header-cell *matHeaderCellDef mat-sort-header> Profile Status </th>
                        <td mat-cell *matCellDef="let row">
                            <span class="badge" [ngClass]="row.status.toLowerCase()">
                                {{ row.status }}
                            </span>
                        </td>
                    </ng-container>

                    <!-- Action -->
                    <ng-container matColumnDef="action">
                        <th mat-header-cell *matHeaderCellDef> Action </th>
                        <td mat-cell *matCellDef="let row">
                            <button type="button" mat-icon-button>
                                <mat-icon fontSet="material-icons-outlined" class="text-primary">
                                    arrow_forward
                                </mat-icon>
                            </button>
                        </td>
                    </ng-container>

                    <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
                    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

                    <tr class="mat-row not--record--found" *matNoDataRow>
                        <td class="mat-cell" colspan="6">
                            <div class="d-flex flex-column align-items-center justify-content-center">
                                <mat-icon>sentiment_dissatisfied</mat-icon>
                                <p class="font-16 text-secondary mb-0 mt-1">No records found</p>
                            </div>
                        </td>
                    </tr>
                </table>
                <mat-paginator [pageSizeOptions]="[5, 10, 25, 50]" showFirstLastButtons>
                </mat-paginator>
            </div>
        </div>
    </div>
</div>
